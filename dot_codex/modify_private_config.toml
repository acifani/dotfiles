{{- /* chezmoi:modify-template */ -}}
{{- $settings := dict
      "features.remote_control"    true
      "tui.status_line"            (list "model-with-reasoning" "current-dir" "thread-name" "context-used" "five-hour-limit" "weekly-limit")
      "tui.status_line_use_colors" true
-}}

{{- if $settings -}}
{{-   $config := dict -}}
{{-   if trim .chezmoi.stdin -}}
{{-     $config = fromToml .chezmoi.stdin -}}
{{-   end -}}
{{-   range $key, $value := $settings -}}
{{-     $config = setValueAtPath $key $value $config -}}
{{-   end -}}
{{-   if and (trim .chezmoi.stdin) (eq (toJson (fromToml .chezmoi.stdin)) (toJson $config)) -}}
{{-     .chezmoi.stdin -}}
{{-   else -}}
{{      toToml $config }}
{{-   end -}}
{{- else -}}
{{-   .chezmoi.stdin -}}
{{- end -}}
